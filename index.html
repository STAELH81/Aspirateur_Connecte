<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aspirateur Connecte — Les Girlsss</title>
  <style>
    :root { --bg: #1e1f22; --card: #2b2d31; --text: #f2f3f5; --muted: #b5bac1; --accent: #eb459e; --green: #57f287; --red: #ed4245; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px; max-width: 980px; margin-inline: auto; }
    header { margin-bottom: 20px; }
    h1 { color: var(--accent); margin: 0; font-size: 1.75rem; }
    .sub { color: var(--muted); font-size: 14px; margin-top: 6px; }
    h2 { font-size: 1rem; margin: 0 0 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    .card { background: var(--card); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; border: 1px solid #3f4147; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    td, th { text-align: left; padding: 10px 8px; border-bottom: 1px solid #3f4147; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    tr:last-child td { border-bottom: none; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
    .stat { background: #111; border-radius: 10px; padding: 14px; }
    .stat span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    .stat b { font-size: 1.5rem; color: var(--green); }
    .highlights { display: grid; gap: 8px; margin-top: 14px; }
    .hl { background: #111; border-radius: 10px; padding: 10px 14px; font-size: 14px; }
    .hl.win b { color: var(--green); }
    .hl.loss b { color: var(--red); }
    .bar-wrap { background: #111; border-radius: 999px; height: 10px; overflow: hidden; margin: 10px 0; }
    .bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); transition: width 0.4s; }
    .medal-1 { color: #fee75c; }
    .medal-2 { color: #b5bac1; }
    .medal-3 { color: #cd7f32; }
    .refresh { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Aspirateur Connecte</h1>
    <p class="sub">Les Girlsss — stats gambling &amp; economie</p>
    <p class="sub" id="updated">Chargement…</p>
    <p class="refresh">Page rafraichie auto toutes les 5 min</p>
  </header>

  <div class="card">
    <h2>Casino aujourd'hui</h2>
    <div class="stat-grid" id="casinoStats"></div>
    <div class="highlights" id="highlights"></div>
  </div>

  <div class="card">
    <h2>Objectif commu (/coop)</h2>
    <p id="coopText" class="sub"></p>
    <div class="bar-wrap"><div class="bar" id="coopBar"></div></div>
  </div>

  <div class="card">
    <h2>Top coins</h2>
    <div id="leaderboard"></div>
  </div>

  <div class="card">
    <h2>Top XP</h2>
    <div id="xpTop"></div>
  </div>

  <script>
    const REFRESH_MS = 5 * 60 * 1000;

    function medal(rank) {
      if (rank === 1) return '<span class="medal-1">#1</span>';
      if (rank === 2) return '<span class="medal-2">#2</span>';
      if (rank === 3) return '<span class="medal-3">#3</span>';
      return rank;
    }

    function table(rows, cols) {
      if (!rows?.length) return "<p class='sub'>Aucune donnee.</p>";
      return "<table><tr>" + cols.map((c) => `<th>${c.label}</th>`).join("") + "</tr>" +
        rows.map((r) => "<tr>" + cols.map((c) => `<td>${c.render(r)}</td>`).join("") + "</tr>").join("") +
        "</table>";
    }

    function render(data) {
      document.getElementById("updated").textContent = data.updatedAt
        ? "Derniere sync bot : " + new Date(data.updatedAt).toLocaleString("fr-FR")
        : "Pas encore synchronise — /dashboard sync sur Discord";

      const c = data.todayCasino || {};
      document.getElementById("casinoStats").innerHTML = [
        ["Parties", c.totalGames || 0],
        ["Mises", c.totalBet || 0],
        ["Jour", c.dayKey || "—"],
      ].map(([k, v]) => `<div class="stat"><span>${k}</span><b>${v}</b></div>`).join("");

      const hl = [];
      if (c.topWinner?.net > 0) {
        hl.push(`<div class="hl win">Plus gros gain : <b>${c.topWinner.name || c.topWinner.id}</b> (+${c.topWinner.net} coins)</div>`);
      }
      if (c.topLoser?.net < 0) {
        hl.push(`<div class="hl loss">Plus grosse perte : <b>${c.topLoser.name || c.topLoser.id}</b> (${c.topLoser.net} coins)</div>`);
      }
      if (c.mostActive?.games > 0) {
        hl.push(`<div class="hl">Plus actif : <b>${c.mostActive.name || c.mostActive.id}</b> (${c.mostActive.games} parties)</div>`);
      }
      document.getElementById("highlights").innerHTML = hl.join("") || "<p class='sub'>Pas de highlight aujourd'hui.</p>";

      const coop = data.coopGoal || { target: 30, progress: 0, reward: 25 };
      const pct = Math.min(100, Math.round((coop.progress / coop.target) * 100)) || 0;
      document.getElementById("coopBar").style.width = pct + "%";
      document.getElementById("coopText").textContent =
        `${coop.progress} / ${coop.target} parties casino sur le serveur — bonus ${coop.reward} coins si objectif atteint`;

      document.getElementById("leaderboard").innerHTML = table(data.leaderboard, [
        { label: "#", render: (r) => medal(r.rank) },
        { label: "Joueur", render: (r) => r.name || r.id },
        { label: "Coins", render: (r) => r.balance.toLocaleString("fr-FR") },
      ]);

      document.getElementById("xpTop").innerHTML = table(data.xpTop, [
        { label: "#", render: (r) => medal(r.rank) },
        { label: "Joueur", render: (r) => r.name || r.id },
        { label: "Niveau", render: (r) => r.level },
        { label: "XP", render: (r) => r.totalXp.toLocaleString("fr-FR") },
      ]);
    }

    async function load() {
      const res = await fetch("/stats.json?" + Date.now());
      render(await res.json());
    }

    load().catch(() => {
      document.getElementById("updated").textContent = "Impossible de charger stats.json";
    });
    setInterval(load, REFRESH_MS);
  </script>
</body>
</html>
