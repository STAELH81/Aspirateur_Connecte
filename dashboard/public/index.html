<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aspirateur Connecte — Dashboard</title>
  <style>
    :root { --bg: #1e1f22; --card: #2b2d31; --text: #f2f3f5; --muted: #b5bac1; --accent: #eb459e; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 24px; }
    h1 { color: var(--accent); margin-top: 0; }
    .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    input, button { padding: 10px 12px; border-radius: 8px; border: none; }
    input { background: #111; color: var(--text); width: 100%; max-width: 320px; }
    button { background: var(--accent); color: #fff; cursor: pointer; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; }
    td, th { text-align: left; padding: 8px; border-bottom: 1px solid #3f4147; }
    .muted { color: var(--muted); font-size: 14px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  </style>
</head>
<body>
  <h1>Aspirateur Connecte</h1>
  <p class="muted">Dashboard local — lecture seule des stats economie / casino / XP.</p>

  <div class="card">
    <div class="row">
      <input id="token" type="password" placeholder="DASHBOARD_SECRET (.env)" />
      <button id="load">Charger</button>
    </div>
    <div class="row">
      <input id="userId" placeholder="Ton ID Discord (optionnel)" />
      <button id="profile">Mon profil</button>
    </div>
  </div>

  <div class="card">
    <h2>Top coins</h2>
    <div id="leaderboard" class="muted">Connecte-toi avec le secret.</div>
  </div>

  <div class="card">
    <h2>Profil</h2>
    <pre id="profileOut" class="muted">—</pre>
  </div>

  <script>
    const params = () => new URLSearchParams({ token: document.getElementById("token").value });
    async function api(path) {
      const res = await fetch(path + "?" + params());
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }
    document.getElementById("load").onclick = async () => {
      try {
        const data = await api("/api/leaderboard");
        document.getElementById("leaderboard").innerHTML =
          "<table><tr><th>#</th><th>ID</th><th>Solde</th></tr>" +
          data.map((r, i) => `<tr><td>${i + 1}</td><td>${r.id}</td><td>${r.balance}</td></tr>`).join("") +
          "</table>";
      } catch (e) {
        document.getElementById("leaderboard").textContent = e.message;
      }
    };
    document.getElementById("profile").onclick = async () => {
      const id = document.getElementById("userId").value.trim();
      if (!id) return;
      try {
        const data = await api("/api/user/" + id);
        document.getElementById("profileOut").textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        document.getElementById("profileOut").textContent = e.message;
      }
    };
  </script>
</body>
</html>
